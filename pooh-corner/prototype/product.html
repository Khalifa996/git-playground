<!doctype html>
<html lang="en-GB" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — Pooh Corner (concept)</title>
  <meta name="description" content="Independent redesign concept for the Pooh Corner online shop. Not the official website.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="product">
  <div id="site-header"></div>

  <main id="main">
    <div class="wrap">
      <nav class="breadcrumb" id="crumb" aria-label="Breadcrumb"></nav>
      <div class="pdp">
        <div id="gallery"></div>
        <div class="pdp-info" id="pdp-info"></div>
      </div>
    </div>

    <section class="section section--sage" aria-labelledby="visit-x">
      <div class="wrap" style="display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center">
        <div style="max-width:620px">
          <p class="eyebrow">Sent from Hartfield</p>
          <h2 id="visit-x" style="margin-bottom:8px">Shipped from our little corner of the forest</h2>
          <p style="margin:0">Visiting the area? Choose collection at checkout and pick it up with a cup of tea.</p>
        </div>
        <a class="btn btn--secondary" href="visit.html">Plan your visit</a>
      </div>
    </section>

    <section class="section" aria-labelledby="rel-title">
      <div class="wrap">
        <div class="section-head">
          <div>
            <p class="eyebrow">You might also like</p>
            <h2 id="rel-title">Goes nicely with</h2>
          </div>
          <a class="link-arrow" href="shop.html">Shop all gifts</a>
        </div>
        <div class="product-grid product-grid--4" id="related"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
